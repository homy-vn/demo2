const K={
'Lớp & đối tượng':`<h4>Hướng đối tượng (OOP) là gì?</h4><p>Cách tổ chức chương trình thành các <b>đối tượng</b>: mỗi đối tượng gom <b>dữ liệu (thuộc tính)</b> và <b>hành vi (phương thức)</b> của một thực thể trong bài toán. Lớp là bản thiết kế; đối tượng là bản thể được tạo từ lớp thông qua hàm khởi tạo (constructor).</p><h4>Ví dụ thực tế</h4><ul><li>Quản lý đào tạo: lớp <code>SinhVien</code> (mssv, hoTen, diemTB; dangKyMon(), xemDiem()); mỗi sinh viên là một đối tượng riêng.</li><li>Game: lớp <code>Enemy</code> sinh ra hàng trăm kẻ địch, mỗi con có máu và vị trí riêng.</li><li>Ứng dụng web: User, Order, Product thường ánh xạ trực tiếp với các bảng cơ sở dữ liệu.</li></ul><h4>4 trụ cột của OOP</h4><ul><li><b>Đóng gói</b>: giấu dữ liệu, chỉ truy cập qua phương thức.</li><li><b>Kế thừa</b>: lớp con tái sử dụng và mở rộng lớp cha.</li><li><b>Đa hình</b>: cùng lời gọi, hành vi tùy đối tượng thật.</li><li><b>Trừu tượng</b>: chỉ phơi bày “cái gì”, che giấu “làm thế nào”.</li></ul><h4>Lợi ích</h4><p>Tái sử dụng code, dễ bảo trì và mở rộng, chia việc theo lớp khi làm nhóm, dễ kiểm thử từng phần.</p>`,
'Đóng gói':`<h4>Phạm vi truy cập</h4><ul><li><code>private</code>: chỉ dùng trong chính lớp (Python dùng quy ước <code>__ten</code>, JavaScript dùng <code>#ten</code>).</li><li><code>protected</code>: lớp và các lớp con.</li><li><code>public</code>: mọi nơi.</li></ul><h4>Thực tế</h4><ul><li>Tài khoản ngân hàng: số dư chỉ đổi qua nạp/rút có kiểm tra điều kiện, không ai gán tùy ý.</li><li>Lớp User: mật khẩu được băm khi lưu, bên ngoài không đọc được bản gốc.</li></ul><h4>Nguyên tắc</h4><p>Đặt thuộc tính private, cung cấp getter/setter hoặc phương thức nghiệp vụ có kiểm tra (validation). Có thể đổi cách cài đặt bên trong mà không ảnh hưởng code bên ngoài.</p>`,
'Kế thừa & đa hình':`<h4>Kế thừa (quan hệ “là một”)</h4><p>Dog là một Animal; Manager là một Employee. Lớp con thừa hưởng thuộc tính, phương thức của lớp cha và có thể ghi đè (override) hoặc bổ sung. Dùng <code>super</code>/<code>base</code> để gọi lại lớp cha.</p><h4>Đa hình</h4><p>Cùng một lời gọi <code>a.speak()</code> nhưng chạy phiên bản của đối tượng thật. Thực tế: danh sách các hình khác nhau cùng gọi <code>draw()</code>; nhiều cổng thanh toán cùng gọi <code>pay()</code>.</p><h4>Lưu ý thực tế</h4><ul><li>Java, C#: một lớp cha, nhiều interface. C++, Python: cho phép đa kế thừa.</li><li>Chỉ kế thừa khi thật sự là “là một”; nếu là “có một” (Car có Engine) hãy dùng <b>composition</b> – thường linh hoạt hơn.</li><li>Tránh cây kế thừa quá sâu, khó hiểu và khó sửa.</li></ul>`,
'Trừu tượng & Interface':`<h4>Lớp trừu tượng và interface</h4><ul><li><b>Lớp trừu tượng</b>: có thể chứa cả phần đã cài đặt lẫn phương thức trừu tượng; dùng khi các lớp con có phần chung.</li><li><b>Interface</b>: chỉ khai báo hợp đồng; một lớp có thể cài đặt nhiều interface.</li></ul><h4>Thực tế</h4><p>Interface <code>PhuongThucThanhToan</code> với <code>pay()</code>: Momo, thẻ, tiền mặt đều cài đặt riêng. Phần xử lý đơn hàng chỉ phụ thuộc interface nên thêm cổng mới mà không sửa code cũ (nguyên lý Open/Closed và Dependency Inversion trong SOLID).</p>`,
'Xử lý ngoại lệ (Exception)':`<h4>Thực hành tốt</h4><ul><li>Bắt đúng loại ngoại lệ cụ thể, tránh <code>catch</code> chung chung rồi bỏ qua (nuốt lỗi).</li><li>Dùng finally (hoặc with / using / try-with-resources) để luôn giải phóng file, kết nối CSDL.</li><li>Ném ngoại lệ (<code>throw</code>) khi dữ liệu không hợp lệ; có thể tự định nghĩa lớp ngoại lệ kế thừa từ lớp lỗi gốc, ví dụ <code>SoDuKhongDuException</code>.</li><li>Ghi log và báo lỗi dễ hiểu cho người dùng, không để lộ chi tiết nội bộ.</li></ul><h4>Thực tế</h4><p>Đọc file điểm không tồn tại, nhập “abc” vào ô số, mất kết nối API: chương trình cần báo lỗi và chạy tiếp thay vì sập.</p>`};
const KW=/("[^"]*")|(\b(?:def|class|return|if|elif|else|for|in|range|while|new|public|static|void|int|double|boolean|bool|string|String|let|const|var|function|extends|override|virtual|auto|this|self|true|false|True|False|constructor|foreach|import|List|Map|Stack|Queue|Dictionary|stack|queue|map|vector)\b)|(\b\d+(?:\.\d+)?\b)/g;
const hl=t=>E(t).replace(KW,(m,s,k,n)=>s?`<span class="s">${m}</span>`:k?`<span class="k">${m}</span>`:`<span class="m">${m}</span>`);
function draw(){
 const t=T[ti];let g='';
 const sc=sec(),li=LI[sc];
 $('sc').innerHTML=G.map((x,i)=>`<button class="${i==sc?'on':''}" data-s="${i}">${i+1}. ${x}</button>`).join('');
 $('tp').innerHTML=T.map((x,i)=>x.g==G[sc]?`<button class="${i==ti?'on':''}" data-t="${i}">${x.n}</button>`:'').join('');
 $('sel').innerHTML=L.map((x,i)=>`<option value="${i}"${i==li?' selected':''}>${x}</option>`).join('');
 $('ds').textContent=t.d;$('kn').hidden=!K[t.n];$('kn').innerHTML=K[t.n]||'';
 const st=si>=0?t.s[si]:null;
 $('cd').innerHTML=t.c[li].split('\n').map(l=>{const m=/\s*§(\d+)\s*$/.exec(l);const tag=m?+m[1]:0;
  return `<div class="ln${st&&tag==st[0]?' on':''}"><i></i>${hl(m?l.slice(0,m.index):l)||' '}</div>`}).join('');
 $('vr').innerHTML=st?st[1].split(';').filter(Boolean).map(p=>{const [k,r]=p.split('=');const [v,ty]=r.split(':');
  return `<div class="b"><small>${E(k)}</small><b>${E(v)}</b>${ty?`<small>${E(ty)}</small>`:''}</div>`}).join(''):'';
 if(st&&t.dl){const a=st[2]?st[2].split(','):[];$('ce').innerHTML=`<small style="color:var(--mu)">${t.dl}</small>`+(a.length?a.map(x=>`<div class="c">${x}</div>`).join(''):'<i style="color:var(--mu)">(rỗng)</i>')}else $('ce').innerHTML='';
 $('co').textContent=st?(st[3]||'').split('|').join('\n')||'›':'›';
 $('nt').textContent=st?st[4]:'Nhấn "Tiếp ▶" để chạy chương trình từng bước.';
}
const stop=()=>{clearInterval(tm);tm=null;$('pl').textContent='⏵ Tự chạy'};
const go=d=>{const n=T[ti].s.length;si=Math.max(-1,Math.min(n-1,si+d));draw();return si<n-1};
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t!=null){ti=+b.dataset.t;si=-1;stop()}else if(b.dataset.s!=null){ti=T.findIndex(x=>x.g==G[+b.dataset.s]);si=-1;stop()}
 else if(b.id=='nx'){stop();go(1);return}else if(b.id=='pv'){stop();go(-1);return}else if(b.id=='rs'){stop();si=-1}
 else if(b.id=='pl'){if(tm){stop();return}if(si>=T[ti].s.length-1)si=-1;b.textContent='⏸ Dừng';go(1);tm=setInterval(()=>{if(!go(1))stop()},1100);return}
 else if(b.id=='th'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';return}
 draw()});
$('sel').onchange=e=>{LI[sec()]=+e.target.value;draw()};
draw();
</script></body></html>
